<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="100%" height="100%">
  <!-- Option 1 Light Logo -->
  <style>
    .text-side { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 48px; fill: #0D0D0D; letter-spacing: 12px; }
    .text-line { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 48px; fill: #0D0D0D; letter-spacing: 12px; }
  </style>
  
  <!-- Horizontal Lines (Black) -->
  <rect x="150" y="55" width="120" height="8" fill="#0D0D0D" />
  <rect x="70" y="85" width="200" height="8" fill="#0D0D0D" />
  <rect x="105" y="115" width="165" height="8" fill="#0D0D0D" />
  
  <!-- Vertical Line (Emerald) -->
  <rect x="280" y="25" width="8" height="130" fill="#10b981" />
  
  <!-- Text -->
  <text x="315" y="70" class="text-side">SIDE</text>
  <text x="315" y="125" class="text-line">LINE</text>
</svg>
